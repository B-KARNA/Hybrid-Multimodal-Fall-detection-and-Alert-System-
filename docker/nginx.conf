events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Support big payloads (e.g. sensor arrays or video frames)
    client_max_body_size 50M;

    upstream alert_manager_backend {
        server alert-manager:8002;
    }

    upstream sensor_service_backend {
        server sensor-service:8000;
    }

    upstream dashboard_backend {
        server dashboard:8501;
    }

    server {
        listen 80;
        server_name _;

        # Root landing page and APK download portal
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ @alert_root;
        }

        # If a POST request comes to root / (such as sensor streaming), forward to alert manager
        location @alert_root {
            proxy_pass http://alert_manager_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # APK Direct Download
        location /download/ {
            alias /usr/share/nginx/html/download/;
            autoindex off;
            types {
                application/vnd.android.package-archive apk;
            }
            default_type application/vnd.android.package-archive;
            add_header Content-Disposition 'attachment; filename="FallAlert.apk"';
        }

        # Central Alert Manager endpoints
        location /status {
            proxy_pass http://alert_manager_backend/status;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /event {
            proxy_pass http://alert_manager_backend/event;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /events {
            proxy_pass http://alert_manager_backend/events;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Outdoor Sensor Service direct endpoint
        location /sensor/ {
            proxy_pass http://sensor_service_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Streamlit 3D Digital Twin Dashboard & WebSocket Proxy
        location ^~ /dashboard/ {
            proxy_pass http://dashboard_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Streamlit internal core assets & websocket
        location ^~ /_stcore/ {
            proxy_pass http://dashboard_backend/_stcore/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Streamlit static assets
        location ^~ /static/ {
            proxy_pass http://dashboard_backend/static/;
        }
    }
}
